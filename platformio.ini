; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:triodrive]
platform = ststm32
board = triodrive
framework = arduino

lib_archive = false

upload_protocol = stlink
monitor_speed = 115200
#monitor_port = /dev/cu.usbmodem207C327A4E301

board_build.ldscript = ./variant/ldscript.ld
build_flags = 
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-DSIMPLEFOC_STM32_DEBUG
    -DUSBD_USE_CDC
	-DHAL_FDCAN_MODULE_ENABLED
	-DHSE_VALUE=25000000
	-I./variant


lib_deps = 
	adafruit/Adafruit NeoPixel@^1.10.4
	#https://github.com/simplefoc/Arduino-FOC-drivers.git#dev
	#https://github.com/simplefoc/Arduino-FOC.git#dev